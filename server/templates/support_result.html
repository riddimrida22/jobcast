{% extends "base.html" %}
{% block title %}{{ heading }} - JobBreak{% endblock %}
{% block og_media %}<meta name="twitter:card" content="summary">{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:30px auto;text-align:center;padding:30px 26px">
  {% if ok %}<div style="font-size:40px;line-height:1">&#10003;</div>{% endif %}
  <h1 style="font-size:22px;margin:10px 0 6px">{{ heading }}</h1>
  <p class="lead" style="margin:0 0 18px">{{ message }}</p>
  <a href="/help" style="color:var(--primary);font-weight:600">Back to help</a>
</div>
{% endblock %}
